<div class="currency-dropdown">
    <button class="currency-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Select Currency">
        <span class="active-currency-label">CAD</span>
        <i class="fas fa-chevron-down dropdown-arrow"></i>
    </button>
    <div class="currency-dropdown-menu" role="listbox">
        <button class="currency-dropdown-item" data-currency="CAD" role="option">CAD ($)</button>
        <button class="currency-dropdown-item" data-currency="INR" role="option">INR (₹)</button>
    </div>
</div>
